name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Siapkan proyek (package.json, config, www, skrip layar kedua)
        run: |
          HTML_FILE=$(ls *.html | head -n 1)
          echo "File HTML yang dipakai: $HTML_FILE"
          mkdir -p www
          cp "$HTML_FILE" www/index.html

          cat > package.json <<'JSON'
          {
            "name": "kuis-lelang-ai",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.2.0",
              "@capacitor/core": "^6.2.0",
              "@capacitor-community/speech-recognition": "^6.0.1"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.2.0"
            }
          }
          JSON

          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.kuislelang.ai",
            "appName": "Kuis Lelang AI",
            "webDir": "www",
            "android": { "allowMixedContent": true }
          }
          JSON

          # Halaman yang tampil di proyektor (layar kedua)
          cat > www/projector.html <<'HTML'
          <!DOCTYPE html>
          <html lang="id" class="dark">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Proyektor</title>
            <script src="tailwind.js" onerror="var s=document.createElement('script');s.src='https://cdn.tailwindcss.com';document.head.appendChild(s)"></script>
            <style>
              body { font-family: sans-serif; margin: 0; background: #020617; }
            </style>
          </head>
          <body class="bg-slate-950 text-slate-100">
            <div class="min-h-screen flex flex-col justify-between p-6 sm:p-10">
              <header class="flex items-center border-b border-slate-800 pb-4">
                <h1 class="text-xl sm:text-3xl font-black text-indigo-400 tracking-wider">ARENA LELANG KUIS AI</h1>
              </header>
              <main id="pmain" class="my-auto py-8"></main>
              <footer id="pfooter" class="border-t border-slate-800 pt-4 grid grid-cols-2 sm:grid-cols-4 gap-3"></footer>
            </div>
            <script>
              function setContent(m, f) {
                document.getElementById('pmain').innerHTML = m;
                document.getElementById('pfooter').innerHTML = f;
              }
            </script>
          </body>
          </html>
          HTML

          # Skrip penghubung tablet -> layar proyektor
          cat > www/second-screen.js <<'JS'
          (function () {
            var cap = window.Capacitor;
            var isNative = cap && cap.isNativePlatform && cap.isNativePlatform();
            var SS = isNative && cap.Plugins ? cap.Plugins.SecondScreen : null;
            var active = false;
            var last = '';
            var origOpen = window.handleOpenProjector;
            var origRender = window.renderProjectorOverlayContent;

            function setBtn() {
              var b = document.querySelector('[onclick="handleOpenProjector()"]');
              if (!b) return;
              var sp = b.querySelectorAll('span');
              if (sp[0]) sp[0].textContent = active ? 'Tutup Layar Proyektor' : 'Buka Mode Proyektor';
              if (sp[1]) sp[1].textContent = active ? 'Tutup' : 'Proyektor';
            }

            function push() {
              if (!active || !SS) return;
              var m = document.getElementById('projector-main-content');
              var f = document.getElementById('projector-footer-teams');
              if (!m || !f) return;
              var key = m.innerHTML + '|' + f.innerHTML;
              if (key === last) return;
              last = key;
              SS.update({ main: m.innerHTML, footer: f.innerHTML }).catch(function () {});
            }

            window.renderProjectorOverlayContent = function () {
              origRender();
              push();
            };

            window.handleOpenProjector = async function () {
              if (SS) {
                if (active) {
                  try { await SS.hide(); } catch (e) {}
                  active = false; last = ''; setBtn();
                  return;
                }
                try {
                  var r = await SS.isAvailable();
                  if (r && r.available) {
                    await SS.show();
                    active = true; last = ''; setBtn(); push();
                    return;
                  }
                } catch (e) {}
                alert('Layar proyektor tidak terdeteksi. Pastikan kabel HDMI/USB-C tersambung. Memakai mode proyektor di layar tablet.');
              }
              origOpen();
            };

            if (SS) {
              try {
                SS.addListener('closed', function () { active = false; last = ''; setBtn(); });
              } catch (e) {}
            }
          })();
          JS



          # Web ke-3: halaman proyektor yang dibuka dari perangkat lain lewat Wi-Fi
          cat > www/projector-web.html <<'HTML'
          <!DOCTYPE html>
          <html lang="id" class="dark">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Arena Lelang Kuis AI - Proyektor</title>
            <script src="/tailwind.js"></script>
            <style>
              body { font-family: sans-serif; margin: 0; background: #020617; }
              @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
              .animate-fadeIn { animation: fadeIn 0.3s ease-in; }
            </style>
          </head>
          <body class="bg-slate-950 text-slate-100">
            <div class="min-h-screen flex flex-col justify-between p-6 sm:p-10">
              <header class="flex items-center justify-between border-b border-slate-800 pb-4">
                <h1 class="text-xl sm:text-3xl font-black text-indigo-400 tracking-wider">ARENA LELANG KUIS AI</h1>
                <div class="flex items-center gap-3">
                  <span id="dot" class="inline-block w-3 h-3 rounded-full bg-slate-600"></span>
                  <span id="status" class="text-xs text-slate-400">Menyambung...</span>
                  <button onclick="toggleFs()" class="text-xs px-3 py-1.5 rounded-lg bg-slate-800 text-slate-200">Layar Penuh</button>
                </div>
              </header>
              <main id="pmain" class="my-auto py-8">
                <p class="text-center text-slate-500 text-lg">Menunggu data dari aplikasi...</p>
              </main>
              <footer id="pfooter" class="border-t border-slate-800 pt-4 grid grid-cols-2 sm:grid-cols-4 gap-3"></footer>
            </div>
            <script>
              var lastVer = -1, fails = 0;
              function setStatus(ok) {
                document.getElementById('dot').className = 'inline-block w-3 h-3 rounded-full ' + (ok ? 'bg-emerald-500' : 'bg-rose-500');
                document.getElementById('status').textContent = ok ? 'Terhubung' : 'Terputus, mencoba lagi...';
              }
              function setContent(m, f) {
                document.getElementById('pmain').innerHTML = m || '<p class="text-center text-slate-500 text-lg">Menunggu data dari aplikasi...</p>';
                document.getElementById('pfooter').innerHTML = f || '';
              }
              function toggleFs() {
                if (document.fullscreenElement) { document.exitFullscreen(); }
                else if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen(); }
              }
              async function tick() {
                try {
                  var r = await fetch('/state', { cache: 'no-store' });
                  var d = await r.json();
                  fails = 0;
                  setStatus(true);
                  if (d.ver !== lastVer) {
                    lastVer = d.ver;
                    setContent(d.main, d.footer);
                  }
                } catch (e) {
                  fails++;
                  if (fails > 2) setStatus(false);
                }
                setTimeout(tick, 500);
              }
              tick();
            </script>
          </body>
          </html>
          HTML

          # Tombol Web Link di dalam aplikasi (menyalakan server dan menampilkan alamat)
          cat > www/weblink.js <<'JS'
          (function () {
            var cap = window.Capacitor;
            var isNative = cap && cap.isNativePlatform && cap.isNativePlatform();
            var WL = isNative && cap.Plugins ? cap.Plugins.WebLink : null;
            if (!WL) return;

            var on = false;
            var url = '';
            var last = '';
            var origRender = window.renderProjectorOverlayContent;

            function push() {
              if (!on) return;
              var m = document.getElementById('projector-main-content');
              var f = document.getElementById('projector-footer-teams');
              if (!m || !f) return;
              var key = m.innerHTML + '|' + f.innerHTML;
              if (key === last) return;
              last = key;
              WL.update({ main: m.innerHTML, footer: f.innerHTML }).catch(function () {});
            }

            window.renderProjectorOverlayContent = function () {
              origRender();
              push();
            };

            var btn = document.createElement('button');
            btn.textContent = 'Web Link';
            btn.style.cssText = 'position:fixed;right:14px;bottom:14px;z-index:9998;padding:10px 16px;border-radius:12px;border:0;background:#4f46e5;color:#fff;font-weight:700;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.5)';

            var panel = document.createElement('div');
            panel.style.cssText = 'display:none;position:fixed;right:14px;bottom:62px;z-index:9999;width:320px;max-width:calc(100vw - 28px);padding:16px;border-radius:14px;background:#0f172a;border:1px solid #334155;color:#e2e8f0;font-family:sans-serif;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.6)';
            document.body.appendChild(btn);
            document.body.appendChild(panel);

            function esc(t) { return String(t).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }

            function render() {
              btn.style.background = on ? '#059669' : '#4f46e5';
              if (!on) {
                panel.innerHTML =
                  '<div style="font-weight:700;margin-bottom:6px">Web Link Proyektor (Wi-Fi)</div>' +
                  '<div style="color:#94a3b8;margin-bottom:12px">Tampilkan layar proyektor dan buka Web 3 (input soal) dari HP/laptop yang satu Wi-Fi dengan tablet ini.</div>' +
                  '<button id="wl-start" style="width:100%;padding:10px;border-radius:10px;border:0;background:#4f46e5;color:#fff;font-weight:700">Nyalakan</button>';
                panel.querySelector('#wl-start').onclick = start;
              } else {
                panel.innerHTML =
                  '<div style="font-weight:700;margin-bottom:6px;color:#34d399">Aktif</div>' +
                  '<div style="color:#94a3b8;margin-bottom:6px">Buka alamat ini di browser perangkat lain (satu Wi-Fi):</div>' +
                  '<div style="font-size:18px;font-weight:800;color:#fbbf24;word-break:break-all;margin-bottom:12px">' + esc(url) + '</div>' +
                  '<div style="color:#94a3b8;margin-bottom:6px">Web 3 (input soal kelompok):</div>' +
                  '<div style="font-size:16px;font-weight:800;color:#a5b4fc;word-break:break-all;margin-bottom:12px">' + esc(url) + '/web3</div>' +
                  '<button id="wl-stop" style="width:100%;padding:10px;border-radius:10px;border:0;background:#e11d48;color:#fff;font-weight:700">Matikan</button>';
                panel.querySelector('#wl-stop').onclick = stop;
              }
            }

            async function start() {
              try {
                var r = await WL.start();
                if (r && r.url) {
                  on = true; url = r.url; last = '';
                  render();
                  window.renderProjectorOverlayContent();
                } else {
                  alert('Alamat Wi-Fi tidak ditemukan. Pastikan tablet tersambung ke Wi-Fi atau hotspot.');
                }
              } catch (e) {
                alert('Gagal menyalakan Web Link: ' + (e && e.message ? e.message : e));
              }
            }

            async function stop() {
              try { await WL.stop(); } catch (e) {}
              on = false; url = ''; last = '';
              render();
            }

            btn.onclick = function () {
              panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
              render();
            };
            render();
          })();
          JS

          # Perbaikan: input tidak hilang fokus, tampilan tidak berkedip, suara ke teks
          cat > www/fixes.js <<'JS'
          (function () {
            var cap = window.Capacitor;
            var isNative = cap && cap.isNativePlatform && cap.isNativePlatform();

            // 1) Render ulang hanya jika ada perubahan nyata. Tiap detik cukup update angka timer,
            //    supaya kolom jawaban tidak dibuat ulang (fokus hilang) dan panel tidak berkedip.
            var origRenderApp = window.renderApp;
            var lastSig = null;
            var lastTime = null;

            function makeSig() {
              try {
                return JSON.stringify([
                  activeTab, gameState, activeQuestionId, highestBid, highestBidderId,
                  bidHistory, isRecording, showCorrectAnswer, teams, questions, evaluationResult,
                  studentAnswerInput.trim().length > 0,
                  showCorrectAnswer ? studentAnswerInput : ''
                ]);
              } catch (e) { return null; }
            }

            window.renderApp = function () {
              var sig = makeSig();
              if (sig !== null && sig === lastSig && gameState === 'ANSWERING' && timeLeft !== lastTime) {
                lastTime = timeLeft;
                document.querySelectorAll('#web2-main-arena .font-mono').forEach(function (el) {
                  el.textContent = formatTime(timeLeft);
                });
                if (typeof renderProjectorOverlayContent === 'function') renderProjectorOverlayContent();
                return;
              }

              var ta = document.getElementById('student-answer-textarea');
              var focusInfo = null;
              if (ta && document.activeElement === ta) {
                focusInfo = { s: ta.selectionStart, e: ta.selectionEnd };
              }

              origRenderApp();
              lastSig = sig;
              lastTime = timeLeft;

              if (focusInfo) {
                var ta2 = document.getElementById('student-answer-textarea');
                if (ta2) {
                  ta2.focus();
                  try { ta2.setSelectionRange(focusInfo.s, focusInfo.e); } catch (e) {}
                }
              }
            };

            // 2) Suara ke teks lewat Android (WebView tidak punya Web Speech API)
            var SR = isNative && cap.Plugins ? cap.Plugins.SpeechRecognition : null;
            if (SR) {
              window.toggleSpeechRecognition = async function () {
                if (isRecording) {
                  try { await SR.stop(); } catch (e) {}
                  isRecording = false;
                  window.renderApp();
                  return;
                }
                try {
                  var av = await SR.available();
                  if (!av || !av.available) {
                    alert('Layanan suara tidak tersedia di perangkat ini. Pastikan aplikasi Google terpasang dan aktif. Silakan ketik jawaban secara manual.');
                    return;
                  }
                  var perm = await SR.requestPermissions();
                  if (!perm || perm.speechRecognition !== 'granted') {
                    alert('Izin mikrofon ditolak. Aktifkan izin mikrofon untuk aplikasi ini di Pengaturan.');
                    return;
                  }
                  isRecording = true;
                  window.renderApp();
                  var res = await SR.start({
                    language: 'id-ID',
                    maxResults: 1,
                    prompt: 'Ucapkan jawaban',
                    partialResults: false,
                    popup: false
                  });
                  var t = res && res.matches && res.matches[0];
                  if (t) {
                    studentAnswerInput = studentAnswerInput ? (studentAnswerInput + ' ' + t) : t;
                    saveData();
                  }
                } catch (e) {
                  alert('Gagal merekam suara: ' + (e && e.message ? e.message : e));
                }
                isRecording = false;
                window.renderApp();
              };
            }
          })();
          JS


          # Layar proyektor: tampilkan jawaban yang diketik operator, lalu jawaban kedua kelompok
          cat > www/answers.js <<'JS'
          (function () {
            var orig = window.renderProjectorOverlayContent;

            function esc(t) {
              return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
              });
            }

            window.renderProjectorOverlayContent = function () {
              orig();
              if (gameState !== 'ANSWERING') return;
              var main = document.getElementById('projector-main-content');
              if (!main || !main.firstElementChild) return;

              var q = questions.find(function (x) { return x.id === activeQuestionId; });
              var author = q ? teams.find(function (t) { return t.id === q.teamId; }) : null;
              var bidder = highestBidderId ? teams.find(function (t) { return t.id === highestBidderId; }) : null;
              var bidderName = bidder ? bidder.name : 'Kelompok Penjawab';
              var authorName = author ? author.name : 'Pembuat Soal';
              var typed = (studentAnswerInput || '').trim();
              var typedHtml = typed ? esc(typed) : '<span class="text-slate-500">Menunggu jawaban...</span>';

              var html;
              if (showCorrectAnswer) {
                html =
                  '<div class="grid grid-cols-1 md:grid-cols-2 gap-4">' +
                    '<div class="p-6 bg-slate-950 border border-emerald-500/40 rounded-2xl space-y-2">' +
                      '<span class="text-xs font-bold text-emerald-400 uppercase block">Jawaban Kelompok ' + esc(bidderName) + ' (Penjawab)</span>' +
                      '<p class="text-xl sm:text-3xl font-bold text-white leading-relaxed">' + typedHtml + '</p>' +
                    '</div>' +
                    '<div class="p-6 bg-indigo-950/60 border border-amber-400/40 rounded-2xl space-y-2">' +
                      '<span class="text-xs font-bold text-amber-400 uppercase block">Jawaban Kelompok ' + esc(authorName) + ' (Pembuat Soal)</span>' +
                      '<p class="text-xl sm:text-3xl font-bold text-amber-300 leading-relaxed">' + esc(q ? q.correctAnswer : '') + '</p>' +
                    '</div>' +
                  '</div>';
              } else {
                html =
                  '<div class="p-6 bg-slate-950 border border-emerald-500/40 rounded-2xl space-y-2">' +
                    '<span class="text-xs font-bold text-emerald-400 uppercase block">Jawaban Kelompok ' + esc(bidderName) + ' (sedang diketik)</span>' +
                    '<p class="text-xl sm:text-3xl font-bold text-white leading-relaxed">' + typedHtml + '</p>' +
                  '</div>';
              }
              main.firstElementChild.insertAdjacentHTML('beforeend', html);
            };

            // Perbarui proyektor setiap kali operator mengetik (tanpa membuat ulang kolom jawaban)
            document.addEventListener('input', function (e) {
              if (e.target && e.target.id === 'student-answer-textarea') {
                window.renderProjectorOverlayContent();
              }
            });
          })();
          JS

          # Web 3 lokal: halaman yang dilayani server di APK (satu Wi-Fi)
          cat > www/web3-local.html <<'HTML'
          <!DOCTYPE html>
          <html lang="id">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Web 3 - Input Soal (Koin)</title>
            <script src="/tailwind.js" onerror="var s=document.createElement('script');s.src='https://cdn.tailwindcss.com';document.head.appendChild(s)"></script>
            <style>body { font-family: system-ui, sans-serif; }</style>
          </head>
          <body class="bg-slate-950 text-slate-100 min-h-screen">
            <header class="border-b border-slate-800 bg-slate-900">
              <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
                <div>
                  <h1 class="text-lg sm:text-2xl font-black text-indigo-400 tracking-wide">ARENA LELANG KUIS AI</h1>
                  <p class="text-xs text-slate-400">Web 3 - Portal Input Soal Kelompok (Koin)</p>
                </div>
                <span id="status" class="text-xs font-bold px-3 py-1 rounded-full bg-slate-800 text-slate-400">Menghubungkan...</span>
              </div>
            </header>

            <main class="max-w-6xl mx-auto p-4 grid grid-cols-1 lg:grid-cols-12 gap-6">
              <section class="lg:col-span-5 bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-5">
                <div class="border-b border-slate-800 pb-4">
                  <h2 class="text-lg font-bold text-white">Input Soal Rahasia</h2>
                  <p class="text-xs text-slate-400 mt-1">Soal dan kunci jawaban langsung dikirim ke aplikasi lelang panitia.</p>
                </div>
                <form id="form" class="space-y-4">
                  <div>
                    <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">Pilih Kelompok Anda:</label>
                    <select id="team" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white"></select>
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">Pertanyaan Soal:</label>
                    <textarea id="question" rows="4" required placeholder="Tuliskan pertanyaan soal di sini..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white"></textarea>
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">Kunci Jawaban Resmi:</label>
                    <input id="answer" type="text" required placeholder="Kunci jawaban tepat..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white">
                  </div>
                  <p class="p-3 bg-slate-950 border border-slate-800 rounded-xl text-[11px] text-slate-400">
                    Harga lelang awal soal ditentukan oleh panitia di aplikasi, dalam satuan koin.
                  </p>
                  <button id="submit" type="submit" class="w-full py-3 rounded-xl text-sm font-bold bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-600/30 disabled:opacity-50">
                    Simpan Soal Secara Rahasia
                  </button>
                  <p id="msg" class="text-xs text-center min-h-[1rem]"></p>
                </form>
              </section>

              <section class="lg:col-span-7 space-y-6">
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
                  <h2 class="text-lg font-bold text-white border-b border-slate-800 pb-3">Saldo Koin Kelompok</h2>
                  <div id="koin" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
                </div>
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
                  <h2 id="bank-title" class="text-lg font-bold text-white border-b border-slate-800 pb-3">Daftar Bank Soal Rahasia</h2>
                  <p class="text-xs text-slate-400">Isi soal disembunyikan. Pengelolaan soal dilakukan panitia di aplikasi.</p>
                  <div id="bank" class="space-y-3 max-h-[480px] overflow-y-auto pr-1"></div>
                </div>
              </section>
            </main>

            <script>
              var state = { teams: [], questions: [] };
              var lastTeamsSig = '';

              function esc(t) {
                return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) {
                  return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
                });
              }

              function setStatus(ok, text) {
                var el = document.getElementById('status');
                el.textContent = text;
                el.className = 'text-xs font-bold px-3 py-1 rounded-full ' +
                  (ok ? 'bg-emerald-500/15 text-emerald-400' : 'bg-rose-500/15 text-rose-400');
              }

              function render() {
                var teams = state.teams || [];
                var questions = state.questions || [];

                var sig = JSON.stringify(teams.map(function (t) { return [t.id, t.name]; }));
                if (sig !== lastTeamsSig) {
                  var sel = document.getElementById('team');
                  var prev = sel.value;
                  sel.innerHTML = teams.map(function (t) {
                    return '<option value="' + esc(t.id) + '">' + esc(t.name) + '</option>';
                  }).join('');
                  if (prev && teams.some(function (t) { return String(t.id) === prev; })) sel.value = prev;
                  lastTeamsSig = sig;
                }

                document.getElementById('koin').innerHTML = teams.slice()
                  .sort(function (a, b) { return b.points - a.points; })
                  .map(function (t) {
                    return '<div class="p-4 bg-slate-950 border border-slate-800 rounded-xl flex items-center justify-between">' +
                      '<span class="px-2.5 py-1 rounded font-bold text-white text-xs ' + esc(t.color || 'bg-slate-700') + '">' + esc(t.name) + '</span>' +
                      '<span class="text-amber-400 font-extrabold text-sm">' + esc(t.points) + ' Koin</span></div>';
                  }).join('') || '<p class="text-xs text-slate-500">Belum ada data kelompok.</p>';

                document.getElementById('bank-title').textContent = 'Daftar Bank Soal Rahasia (' + questions.length + ' Soal)';
                document.getElementById('bank').innerHTML = questions.map(function (q) {
                  var t = teams.find(function (x) { return x.id === q.teamId; });
                  return '<div class="p-4 bg-slate-950 border border-slate-800 rounded-xl space-y-2">' +
                    '<div class="flex justify-between items-center text-xs">' +
                    '<span class="px-2.5 py-1 rounded font-bold text-white ' + esc(t ? (t.color || 'bg-slate-700') : 'bg-slate-700') + '">' + esc(t ? t.name : 'Unknown') + '</span>' +
                    '<span class="text-amber-400 font-bold bg-amber-400/10 px-2.5 py-1 rounded border border-amber-400/20">Status: ' + esc(String(q.status || '').toUpperCase()) + '</span></div>' +
                    '<p class="text-xs text-slate-400 font-mono italic">" Soal Disembunyikan (••••••••) "</p></div>';
                }).join('');
              }

              async function load() {
                try {
                  var r = await fetch('/web3/state', { cache: 'no-store' });
                  state = await r.json();
                  render();
                  setStatus(true, 'Terhubung');
                } catch (e) {
                  setStatus(false, 'Terputus dari tablet');
                }
              }

              document.getElementById('form').addEventListener('submit', async function (ev) {
                ev.preventDefault();
                var msg = document.getElementById('msg');
                var btn = document.getElementById('submit');
                var teamId = document.getElementById('team').value;
                var q = document.getElementById('question').value.trim();
                var a = document.getElementById('answer').value.trim();
                if (!teamId || !q || !a) { msg.textContent = 'Lengkapi semua kolom.'; msg.className = 'text-xs text-center text-rose-400'; return; }

                btn.disabled = true;
                msg.textContent = 'Mengirim...'; msg.className = 'text-xs text-center text-slate-400';
                try {
                  var r = await fetch('/web3/add', {
                    method: 'POST',
                    body: JSON.stringify({ teamId: teamId, questionText: q, correctAnswer: a })
                  });
                  var d = await r.json();
                  if (d && d.ok) {
                    document.getElementById('question').value = '';
                    document.getElementById('answer').value = '';
                    msg.textContent = 'Soal berhasil disimpan secara rahasia!';
                    msg.className = 'text-xs text-center text-emerald-400';
                    setTimeout(load, 2500);
                  } else {
                    msg.textContent = (d && d.error) || 'Gagal menyimpan soal.';
                    msg.className = 'text-xs text-center text-rose-400';
                  }
                } catch (e) {
                  msg.textContent = 'Gagal terhubung ke tablet. Pastikan satu Wi-Fi.';
                  msg.className = 'text-xs text-center text-rose-400';
                }
                btn.disabled = false;
              });

              load();
              setInterval(load, 3000);
            </script>
          </body>
          </html>
