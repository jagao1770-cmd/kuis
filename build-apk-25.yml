          cat > www/localsync.js <<'JS'
          (function () {
            var cap = window.Capacitor;
            var isNative = cap && cap.isNativePlatform && cap.isNativePlatform();
            var WL = isNative && cap.Plugins ? cap.Plugins.WebLink : null;
            if (!WL) return;
            var lastPushed = '';

            function publicState() {
              return {
                teams: teams.map(function (t) { return { id: t.id, name: t.name, color: t.color, points: t.points }; }),
                questions: questions.map(function (q) { return { id: q.id, teamId: q.teamId, status: q.status }; })
              };
            }

            async function tick() {
              try {
                var st = JSON.stringify(publicState());
                if (st !== lastPushed) {
                  await WL.setState({ state: st });
                  lastPushed = st;
                }
                var r = await WL.takeInbox();
                var items = JSON.parse((r && r.json) || '[]');
                var changed = false;
                items.forEach(function (it) {
                  if (questions.some(function (q) { return q.id === it.id; })) return;
                  if (!teams.some(function (t) { return String(t.id) === String(it.teamId); })) return;
                  var team = teams.find(function (t) { return String(t.id) === String(it.teamId); });
                  var cnt = questions.filter(function (q) { return String(q.teamId) === String(team.id); }).length;
                  if (cnt >= (window.MAX_SOAL || 5)) return;
                  questions.push({
                    id: it.id, teamId: team.id, questionText: it.questionText,
                    correctAnswer: it.correctAnswer, initialBidPrice: 10, status: 'ready'
                  });
                  changed = true;
                });
                if (changed) { saveData(); window.renderApp(); }
              } catch (e) {}
            }

            setInterval(tick, 1500);
            setTimeout(tick, 1000);
          })();
          JS

