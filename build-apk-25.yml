      - name: Izin mikrofon dan layanan suara di AndroidManifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" /><queries><intent><action android:name="android.speech.RecognitionService" /></intent></queries><application#' $MANIFEST
          grep -c RECORD_AUDIO $MANIFEST
          sed -i '/^dependencies {/a\    implementation "org.nanohttpd:nanohttpd:2.3.1"' android/app/build.gradle
          grep -n nanohttpd android/app/build.gradle

