name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Siapkan proyek (package.json, config, www, skrip layar kedua)
        run: |
          HTML_FILE=$(ls *.html | head -n 1)
          echo "File HTML yang dipakai: $HTML_FILE"
          mkdir -p www
          cp "$HTML_FILE" www/index.html

          cat > package.json <<'JSON'
          {
            "name": "kuis-lelang-ai",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.2.0",
              "@capacitor/core": "^6.2.0",
              "@capacitor-community/speech-recognition": "^6.0.1"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.2.0"
            }
          }
          JSON

          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.kuislelang.ai",
            "appName": "Kuis Lelang AI",
            "webDir": "www",
            "android": { "allowMixedContent": true }
          }
          JSON

          # Halaman yang tampil di proyektor (layar kedua)
          cat > www/projector.html <<'HTML'
          <!DOCTYPE html>
          <html lang="id" class="dark">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Proyektor</title>
            <script src="tailwind.js" onerror="var s=document.createElement('script');s.src='https://cdn.tailwindcss.com';document.head.appendChild(s)"></script>
            <style>
              body { font-family: sans-serif; margin: 0; background: #020617; }
            </style>
          </head>
          <body class="bg-slate-950 text-slate-100">
            <div class="min-h-screen flex flex-col justify-between p-6 sm:p-10">
              <header class="flex items-center border-b border-slate-800 pb-4">
                <h1 class="text-xl sm:text-3xl font-black text-indigo-400 tracking-wider">ARENA LELANG KUIS AI</h1>
              </header>
              <main id="pmain" class="my-auto py-8"></main>
              <footer id="pfooter" class="border-t border-slate-800 pt-4 grid grid-cols-2 sm:grid-cols-4 gap-3"></footer>
            </div>
            <script>
              function setContent(m, f) {
                document.getElementById('pmain').innerHTML = m;
                document.getElementById('pfooter').innerHTML = f;
              }
            </script>
          </body>
          </html>
          HTML

          # Skrip penghubung tablet -> layar proyektor
          cat > www/second-screen.js <<'JS'
          (function () {
            var cap = window.Capacitor;
            var isNative = cap && cap.isNativePlatform && cap.isNativePlatform();
            var SS = isNative && cap.Plugins ? cap.Plugins.SecondScreen : null;
            var active = false;
            var last = '';
            var origOpen = window.handleOpenProjector;
            var origRender = window.renderProjectorOverlayContent;

            function setBtn() {
              var b = document.querySelector('[onclick="handleOpenProjector()"]');
              if (!b) return;
              var sp = b.querySelectorAll('span');
              if (sp[0]) sp[0].textContent = active ? 'Tutup Layar Proyektor' : 'Buka Mode Proyektor';
              if (sp[1]) sp[1].textContent = active ? 'Tutup' : 'Proyektor';
            }

            function push() {
              if (!active || !SS) return;
              var m = document.getElementById('projector-main-content');
              var f = document.getElementById('projector-footer-teams');
              if (!m || !f) return;
              var key = m.innerHTML + '|' + f.innerHTML;
              if (key === last) return;
              last = key;
              SS.update({ main: m.innerHTML, footer: f.innerHTML }).catch(function () {});
            }

            window.renderProjectorOverlayContent = function () {
              origRender();
              push();
            };

            window.handleOpenProjector = async function () {
              if (SS) {
                if (active) {
                  try { await SS.hide(); } catch (e) {}
                  active = false; last = ''; setBtn();
                  return;
                }
                try {
                  var r = await SS.isAvailable();
                  if (r && r.available) {
                    await SS.show();
                    active = true; last = ''; setBtn(); push();
                    return;
                  }
                } catch (e) {}
                alert('Layar proyektor tidak terdeteksi. Pastikan kabel HDMI/USB-C tersambung. Memakai mode proyektor di layar tablet.');
              }
              origOpen();
            };

            if (SS) {
              try {
                SS.addListener('closed', function () { active = false; last = ''; setBtn(); });
              } catch (e) {}
            }
          })();
          JS



          # Web ke-3: halaman proyektor yang dibuka dari perangkat lain lewat Wi-Fi
          cat > www/projector-web.html <<'HTML'
          <!DOCTYPE html>
          <html lang="id" class="dark">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Arena Lelang Kuis AI - Proyektor</title>
            <script src="/tailwind.js"></script>
            <style>
              body { font-family: sans-serif; margin: 0; background: #020617; }
              @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
              .animate-fadeIn { animation: fadeIn 0.3s ease-in; }
            </style>
          </head>
          <body class="bg-slate-950 text-slate-100">
            <div class="min-h-screen flex flex-col justify-between p-6 sm:p-10">
              <header class="flex items-center justify-between border-b border-slate-800 pb-4">
                <h1 class="text-xl sm:text-3xl font-black text-indigo-400 tracking-wider">ARENA LELANG KUIS AI</h1>
                <div class="flex items-center gap-3">
                  <span id="dot" class="inline-block w-3 h-3 rounded-full bg-slate-600"></span>
                  <span id="status" class="text-xs text-slate-400">Menyambung...</span>
                  <button onclick="toggleFs()" class="text-xs px-3 py-1.5 rounded-lg bg-slate-800 text-slate-200">Layar Penuh</button>
                </div>
              </header>
              <main id="pmain" class="my-auto py-8">
                <p class="text-center text-slate-500 text-lg">Menunggu data dari aplikasi...</p>
              </main>
              <footer id="pfooter" class="border-t border-slate-800 pt-4 grid grid-cols-2 sm:grid-cols-4 gap-3"></footer>
            </div>
            <script>
              var lastVer = -1, fails = 0;
              function setStatus(ok) {
                document.getElementById('dot').className = 'inline-block w-3 h-3 rounded-full ' + (ok ? 'bg-emerald-500' : 'bg-rose-500');
                document.getElementById('status').textContent = ok ? 'Terhubung' : 'Terputus, mencoba lagi...';
              }
              function setContent(m, f) {
                document.getElementById('pmain').innerHTML = m || '<p class="text-center text-slate-500 text-lg">Menunggu data dari aplikasi...</p>';
                document.getElementById('pfooter').innerHTML = f || '';
              }
              function toggleFs() {
                if (document.fullscreenElement) { document.exitFullscreen(); }
                else if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen(); }
              }
              async function tick() {
                try {
                  var r = await fetch('/state', { cache: 'no-store' });
                  var d = await r.json();
                  fails = 0;
                  setStatus(true);
                  if (d.ver !== lastVer) {
                    lastVer = d.ver;
                    setContent(d.main, d.footer);
                  }
                } catch (e) {
                  fails++;
                  if (fails > 2) setStatus(false);
                }
                setTimeout(tick, 500);
              }
              tick();
            </script>
          </body>
          </html>
          HTML

          # Tombol Web Link di dalam aplikasi (menyalakan server dan menampilkan alamat)
          cat > www/weblink.js <<'JS'
          (function () {
            var cap = window.Capacitor;
            var isNative = cap && cap.isNativePlatform && cap.isNativePlatform();
            var WL = isNative && cap.Plugins ? cap.Plugins.WebLink : null;
            if (!WL) return;

            var on = false;
            var url = '';
            var last = '';
            var origRender = window.renderProjectorOverlayContent;

            function push() {
              if (!on) return;
              var m = document.getElementById('projector-main-content');
              var f = document.getElementById('projector-footer-teams');
              if (!m || !f) return;
              var key = m.innerHTML + '|' + f.innerHTML;
              if (key === last) return;
              last = key;
              WL.update({ main: m.innerHTML, footer: f.innerHTML }).catch(function () {});
            }

            window.renderProjectorOverlayContent = function () {
              origRender();
              push();
            };

            var btn = document.createElement('button');
            btn.textContent = 'Web Link';
            btn.style.cssText = 'position:fixed;right:14px;bottom:14px;z-index:9998;padding:10px 16px;border-radius:12px;border:0;background:#4f46e5;color:#fff;font-weight:700;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.5)';

            var panel = document.createElement('div');
            panel.style.cssText = 'display:none;position:fixed;right:14px;bottom:62px;z-index:9999;width:320px;max-width:calc(100vw - 28px);padding:16px;border-radius:14px;background:#0f172a;border:1px solid #334155;color:#e2e8f0;font-family:sans-serif;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.6)';
            document.body.appendChild(btn);
            document.body.appendChild(panel);

            function esc(t) { return String(t).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }

            function render() {
              btn.style.background = on ? '#059669' : '#4f46e5';
              if (!on) {
                panel.innerHTML =
                  '<div style="font-weight:700;margin-bottom:6px">Web Link Proyektor (Wi-Fi)</div>' +
                  '<div style="color:#94a3b8;margin-bottom:12px">Tampilkan layar proyektor dan buka Web 3 (input soal) dari HP/laptop yang satu Wi-Fi dengan tablet ini.</div>' +
                  '<button id="wl-start" style="width:100%;padding:10px;border-radius:10px;border:0;background:#4f46e5;color:#fff;font-weight:700">Nyalakan</button>';
                panel.querySelector('#wl-start').onclick = start;
              } else {
                panel.innerHTML =
                  '<div style="font-weight:700;margin-bottom:6px;color:#34d399">Aktif</div>' +
                  '<div style="color:#94a3b8;margin-bottom:6px">Buka alamat ini di browser perangkat lain (satu Wi-Fi):</div>' +
                  '<div style="font-size:18px;font-weight:800;color:#fbbf24;word-break:break-all;margin-bottom:12px">' + esc(url) + '</div>' +
                  '<div style="color:#94a3b8;margin-bottom:6px">Web 3 (input soal kelompok):</div>' +
                  '<div style="font-size:16px;font-weight:800;color:#a5b4fc;word-break:break-all;margin-bottom:12px">' + esc(url) + '/web3</div>' +
                  '<button id="wl-stop" style="width:100%;padding:10px;border-radius:10px;border:0;background:#e11d48;color:#fff;font-weight:700">Matikan</button>';
                panel.querySelector('#wl-stop').onclick = stop;
              }
            }

            async function start() {
              try {
                var r = await WL.start();
                if (r && r.url) {
                  on = true; url = r.url; last = '';
                  render();
                  window.renderProjectorOverlayContent();
                } else {
                  alert('Alamat Wi-Fi tidak ditemukan. Pastikan tablet tersambung ke Wi-Fi atau hotspot.');
                }
              } catch (e) {
                alert('Gagal menyalakan Web Link: ' + (e && e.message ? e.message : e));
              }
            }

            async function stop() {
              try { await WL.stop(); } catch (e) {}
              on = false; url = ''; last = '';
              render();
            }

            btn.onclick = function () {
              panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
              render();
            };
            render();
          })();
          JS

          # Perbaikan: input tidak hilang fokus, tampilan tidak berkedip, suara ke teks
          cat > www/fixes.js <<'JS'
          (function () {
            var cap = window.Capacitor;
            var isNative = cap && cap.isNativePlatform && cap.isNativePlatform();

            // 1) Render ulang hanya jika ada perubahan nyata. Tiap detik cukup update angka timer,
            //    supaya kolom jawaban tidak dibuat ulang (fokus hilang) dan panel tidak berkedip.
            var origRenderApp = window.renderApp;
            var lastSig = null;
            var lastTime = null;

            function makeSig() {
              try {
                return JSON.stringify([
                  activeTab, gameState, activeQuestionId, highestBid, highestBidderId,
                  bidHistory, isRecording, teams, questions, evaluationResult
                ]);
              } catch (e) { return null; }
            }

            window.renderApp = function () {
              var sig = makeSig();
              if (sig !== null && sig === lastSig && gameState === 'ANSWERING' && timeLeft !== lastTime) {
                lastTime = timeLeft;
                document.querySelectorAll('#web2-main-arena .font-mono').forEach(function (el) {
                  el.textContent = formatTime(timeLeft);
                });
                if (typeof renderProjectorOverlayContent === 'function') renderProjectorOverlayContent();
                return;
              }

              var ta = document.getElementById('student-answer-textarea');
              var focusInfo = null;
              if (ta && document.activeElement === ta) {
                focusInfo = { s: ta.selectionStart, e: ta.selectionEnd };
              }

              origRenderApp();
              lastSig = sig;
              lastTime = timeLeft;

              if (focusInfo) {
                var ta2 = document.getElementById('student-answer-textarea');
                if (ta2) {
                  ta2.focus();
                  try { ta2.setSelectionRange(focusInfo.s, focusInfo.e); } catch (e) {}
                }
              }
            };

            // 2) Suara ke teks lewat Android (WebView tidak punya Web Speech API)
            var SR = isNative && cap.Plugins ? cap.Plugins.SpeechRecognition : null;
            if (SR) {
              window.toggleSpeechRecognition = async function () {
                if (isRecording) {
                  try { await SR.stop(); } catch (e) {}
                  isRecording = false;
                  window.renderApp();
                  return;
                }
                try {
                  var av = await SR.available();
                  if (!av || !av.available) {
                    alert('Layanan suara tidak tersedia di perangkat ini. Pastikan aplikasi Google terpasang dan aktif. Silakan ketik jawaban secara manual.');
                    return;
                  }
                  var perm = await SR.requestPermissions();
                  if (!perm || perm.speechRecognition !== 'granted') {
                    alert('Izin mikrofon ditolak. Aktifkan izin mikrofon untuk aplikasi ini di Pengaturan.');
                    return;
                  }
                  isRecording = true;
                  window.renderApp();
                  var res = await SR.start({
                    language: 'id-ID',
                    maxResults: 1,
                    prompt: 'Ucapkan jawaban',
                    partialResults: false,
                    popup: false
                  });
                  var t = res && res.matches && res.matches[0];
                  if (t) {
                    studentAnswerInput = studentAnswerInput ? (studentAnswerInput + ' ' + t) : t;
                    saveData();
                  }
                } catch (e) {
                  alert('Gagal merekam suara: ' + (e && e.message ? e.message : e));
                }
                isRecording = false;
                window.renderApp();
              };
            }
          })();
          JS


          # Layar proyektor: tampilkan jawaban yang diketik operator, lalu jawaban kedua kelompok
          cat > www/answers.js <<'JS'
          (function () {
            var orig = window.renderProjectorOverlayContent;

            function esc(t) {
              return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
              });
            }

            function esc2(t) { return esc(t); }

            window.resultKind = function () {
              if (!evaluationResult) return null;
              if (evaluationResult.isCorrect) return 'correct';
              return /Kehabisan Waktu/i.test(evaluationResult.feedback || '') ? 'timeout' : 'wrong';
            };

            function showResult() {
              var main = document.getElementById('projector-main-content');
              if (!main) return;
              var kind = window.resultKind();
              var cfg = {
                correct: { title: 'JAWABAN BENAR!', c1: '#059669', c2: '#34d399', glow: 'rgba(16,185,129,.55)', anim: 'kpop' },
                wrong: { title: 'JAWABAN SALAH!', c1: '#be123c', c2: '#fb7185', glow: 'rgba(225,29,72,.55)', anim: 'kshake' },
                timeout: { title: 'WAKTU HABIS!', c1: '#d97706', c2: '#fbbf24', glow: 'rgba(245,158,11,.55)', anim: 'kring' }
              }[kind];
              if (!cfg) return;

              var paths = {
                correct: '<path d="M5 12.5l4.5 4.5L19 7"/>',
                wrong: '<path d="M6 6l12 12M18 6L6 18"/>',
                timeout: '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 3h6M12 3v2"/>'
              };
              var icon = '<svg viewBox="0 0 24 24" width="96" height="96" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">' + paths[kind] + '</svg>';

              var confetti = '';
              if (kind === 'correct') {
                var cols = ['#34d399', '#fbbf24', '#60a5fa', '#f472b6', '#a78bfa', '#f87171'];
                for (var i = 0; i < 26; i++) {
                  confetti += '<span style="position:absolute;top:-20px;left:' + ((i * 37) % 100) + '%;width:10px;height:16px;border-radius:2px;background:' +
                    cols[i % cols.length] + ';opacity:0;animation:kfall ' + (2.2 + (i % 5) * 0.35) + 's linear ' + ((i % 9) * 0.2) + 's infinite"></span>';
                }
              }
              var flash = kind === 'wrong'
                ? '<div style="position:absolute;inset:0;background:#e11d48;opacity:0;animation:kflash .6s ease-out 2"></div>'
                : '';
              var rings = '';
              for (var r = 0; r < 3; r++) {
                rings += '<span style="position:absolute;width:170px;height:170px;border-radius:50%;border:4px solid ' + cfg.c2 +
                  ';opacity:0;animation:kripple 1.8s ease-out ' + (r * 0.6) + 's infinite"></span>';
              }

              var css = '<style>' +
                '@keyframes kpop{0%{transform:scale(0) rotate(-25deg);opacity:0}60%{transform:scale(1.25) rotate(6deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}' +
                '@keyframes kshake{0%{transform:scale(0);opacity:0}35%{transform:scale(1.2);opacity:1}50%{transform:translateX(-22px)}60%{transform:translateX(22px)}70%{transform:translateX(-16px)}80%{transform:translateX(16px)}90%{transform:translateX(-8px)}100%{transform:translateX(0) scale(1);opacity:1}}' +
                '@keyframes kring{0%{transform:scale(0);opacity:0}30%{transform:scale(1.2);opacity:1}40%{transform:scale(1) rotate(-14deg)}50%{transform:rotate(14deg)}60%{transform:rotate(-14deg)}70%{transform:rotate(14deg)}80%{transform:rotate(-8deg)}90%{transform:rotate(8deg)}100%{transform:rotate(0);opacity:1}}' +
                '@keyframes kripple{0%{transform:scale(.7);opacity:.8}100%{transform:scale(2.4);opacity:0}}' +
                '@keyframes kfall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(460px) rotate(560deg);opacity:0}}' +
                '@keyframes kflash{0%{opacity:0}25%{opacity:.55}100%{opacity:0}}' +
                '@keyframes kfade{0%{opacity:0;transform:translateY(24px)}100%{opacity:1;transform:translateY(0)}}' +
                '@keyframes kpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}' +
                '</style>';

              main.innerHTML = css +
                '<div style="position:relative;overflow:hidden;max-width:880px;margin:0 auto;padding:40px 24px 36px;border-radius:28px;text-align:center;' +
                'background:radial-gradient(circle at 50% 30%,' + cfg.glow + ',#0f172a 70%);border:2px solid ' + cfg.c2 + ';">' +
                  confetti + flash +
                  '<div style="position:relative;display:flex;align-items:center;justify-content:center;height:190px;">' + rings +
                    '<div style="position:relative;width:170px;height:170px;border-radius:50%;display:flex;align-items:center;justify-content:center;' +
                    'background:linear-gradient(135deg,' + cfg.c1 + ',' + cfg.c2 + ');box-shadow:0 0 60px ' + cfg.glow + ';animation:' + cfg.anim + ' .9s ease-out both;">' + icon + '</div>' +
                  '</div>' +
                  '<h2 style="margin:18px 0 8px;font-size:clamp(32px,6vw,64px);font-weight:900;color:#fff;letter-spacing:1px;opacity:0;animation:kfade .6s ease-out .5s both,kpulse 1.4s ease-in-out 1.2s infinite;">' + cfg.title + '</h2>' +
                  '<p style="margin:0;font-size:clamp(16px,2.4vw,26px);font-weight:600;color:#e2e8f0;opacity:0;animation:kfade .6s ease-out .8s both;">' + esc(evaluationResult.feedback || '') + '</p>' +
                '</div>';
            }



            window.renderProjectorOverlayContent = function () {
              orig();
              if (gameState === 'RESULT' && evaluationResult) {
                showResult();
                if (window.resultKind() !== 'correct') {
                  var rm = document.getElementById('projector-main-content');
                  var rq = questions.find(function (x) { return x.id === activeQuestionId; });
                  var ra = rq ? teams.find(function (t) { return t.id === rq.teamId; }) : null;
                  var rb = highestBidderId ? teams.find(function (t) { return t.id === highestBidderId; }) : null;
                  var rt = (studentAnswerInput || '').trim();
                  if (rm) {
                    rm.insertAdjacentHTML('beforeend',
                      '<div style="max-width:880px;margin:20px auto 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;text-align:left;opacity:0;animation:kfade .7s ease-out 1.2s both">' +
                        '<div style="padding:22px;border-radius:18px;background:#020617;border:2px solid rgba(16,185,129,.45)">' +
                          '<div style="font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#34d399;margin-bottom:8px">Jawaban Kelompok ' + esc(rb ? rb.name : 'Penjawab') + ' (Penjawab)</div>' +
                          '<div style="font-size:28px;font-weight:800;color:#fff;line-height:1.4">' + (rt ? esc(rt) : '<span style="color:#64748b">(tidak ada jawaban)</span>') + '</div>' +
                        '</div>' +
                        '<div style="padding:22px;border-radius:18px;background:rgba(49,46,129,.45);border:2px solid rgba(251,191,36,.5)">' +
                          '<div style="font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#fbbf24;margin-bottom:8px">Jawaban Kelompok ' + esc(ra ? ra.name : 'Pembuat Soal') + ' (Pembuat Soal)</div>' +
                          '<div style="font-size:28px;font-weight:800;color:#fcd34d;line-height:1.4">' + esc(rq ? rq.correctAnswer : '') + '</div>' +
                        '</div>' +
                      '</div>');
                  }
                }
                return;
              }
              if (gameState !== 'ANSWERING') return;
              var main = document.getElementById('projector-main-content');
              if (!main || !main.firstElementChild) return;

              var q = questions.find(function (x) { return x.id === activeQuestionId; });
              var author = q ? teams.find(function (t) { return t.id === q.teamId; }) : null;
              var bidder = highestBidderId ? teams.find(function (t) { return t.id === highestBidderId; }) : null;
              var bidderName = bidder ? bidder.name : 'Kelompok Penjawab';
              var authorName = author ? author.name : 'Pembuat Soal';
              var typed = (studentAnswerInput || '').trim();
              var typedHtml = typed ? esc(typed) : '<span class="text-slate-500">Menunggu jawaban...</span>';

              var html;
              if (showCorrectAnswer) {
                html =
                  '<div class="grid grid-cols-1 md:grid-cols-2 gap-4">' +
