          cat > $DIR/SecondScreenPlugin.java <<'JAVA'
          package com.kuislelang.ai;

          import android.app.Presentation;
          import android.content.Context;
          import android.hardware.display.DisplayManager;
          import android.os.Bundle;
          import android.view.Display;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import org.json.JSONObject;

          @CapacitorPlugin(name = "SecondScreen")
          public class SecondScreenPlugin extends Plugin {
              private Presentation presentation;
              private WebView projectorWeb;
              private boolean loaded = false;
              private String pendingMain = "";
              private String pendingFooter = "";

              private Display findDisplay() {
                  DisplayManager dm = (DisplayManager) getContext().getSystemService(Context.DISPLAY_SERVICE);
                  Display[] ds = dm.getDisplays(DisplayManager.DISPLAY_CATEGORY_PRESENTATION);
                  if (ds != null && ds.length > 0) return ds[0];
                  Display[] all = dm.getDisplays();
                  for (Display d : all) {
                      if (d.getDisplayId() != Display.DEFAULT_DISPLAY) return d;
                  }
                  return null;
              }

              private void pushNow() {
                  if (projectorWeb != null && loaded) {
                      String js = "setContent(" + JSONObject.quote(pendingMain) + "," + JSONObject.quote(pendingFooter) + ");";
                      projectorWeb.evaluateJavascript(js, null);
                  }
              }

              @PluginMethod
              public void isAvailable(PluginCall call) {
                  JSObject r = new JSObject();
                  r.put("available", findDisplay() != null);
                  call.resolve(r);
              }

              @PluginMethod
              public void show(final PluginCall call) {
                  getActivity().runOnUiThread(() -> {
                      try {
                          if (presentation != null && presentation.isShowing()) {
                              call.resolve();
                              return;
                          }
                          Display d = findDisplay();
                          if (d == null) {
                              call.reject("Tidak ada layar kedua");
                              return;
                          }
                          loaded = false;
                          presentation = new ProjectorPresentation(getActivity(), d);
                          presentation.setOnDismissListener(dialog -> {
                              presentation = null;
                              projectorWeb = null;
                              loaded = false;
                              notifyListeners("closed", new JSObject());
                          });
                          presentation.show();
                          call.resolve();
                      } catch (Exception e) {
                          call.reject(String.valueOf(e.getMessage()));
                      }
                  });
              }

              @PluginMethod
              public void update(final PluginCall call) {
                  pendingMain = call.getString("main", "");
                  pendingFooter = call.getString("footer", "");
                  getActivity().runOnUiThread(() -> pushNow());
                  call.resolve();
              }

              @PluginMethod
              public void hide(final PluginCall call) {
                  getActivity().runOnUiThread(() -> {
                      if (presentation != null) presentation.dismiss();
                      call.resolve();
                  });
              }

              @Override
              protected void handleOnDestroy() {
                  if (presentation != null) presentation.dismiss();
                  super.handleOnDestroy();
              }

              private class ProjectorPresentation extends Presentation {
                  ProjectorPresentation(Context ctx, Display display) {
                      super(ctx, display);
                  }

                  @Override
                  protected void onCreate(Bundle savedInstanceState) {
                      super.onCreate(savedInstanceState);
                      projectorWeb = new WebView(getContext());
                      projectorWeb.setBackgroundColor(0xFF020617);
                      WebSettings s = projectorWeb.getSettings();
                      s.setJavaScriptEnabled(true);
                      s.setDomStorageEnabled(true);
                      projectorWeb.setWebViewClient(new WebViewClient() {
                          @Override
                          public void onPageFinished(WebView view, String url) {
                              loaded = true;
                              pushNow();
                          }
                      });
                      setContentView(projectorWeb);
                      projectorWeb.loadUrl("file:///android_asset/public/projector.html");
                  }
              }
          }
          JAVA

          cat > $DIR/WebLinkPlugin.java <<'JAVA'
          package com.kuislelang.ai;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import fi.iki.elonen.NanoHTTPD;
          import java.io.InputStream;
          import java.net.Inet4Address;
          import java.net.InetAddress;
          import java.net.NetworkInterface;
          import java.util.Collections;
          import java.util.HashMap;
          import java.util.Map;
          import org.json.JSONArray;
          import org.json.JSONObject;

          @CapacitorPlugin(name = "WebLink")
          public class WebLinkPlugin extends Plugin {
              private LinkServer server;
              private int port = 8080;
              private volatile String main = "";
              private volatile String footer = "";
              private volatile long ver = 0;
              private volatile String pubState = "{\"teams\":[],\"questions\":[]}";
              private final JSONArray inbox = new JSONArray();

              private String findIp() {
                  try {
                      for (NetworkInterface ni : Collections.list(NetworkInterface.getNetworkInterfaces())) {
                          if (!ni.isUp() || ni.isLoopback()) continue;
                          for (InetAddress a : Collections.list(ni.getInetAddresses())) {
                              if (a instanceof Inet4Address && a.isSiteLocalAddress()) {
                                  return a.getHostAddress();
                              }
                          }
                      }
                  } catch (Exception e) {
                  }
                  return null;
              }

              @PluginMethod
              public void start(PluginCall call) {
                  try {
                      if (server == null) {
                          Exception last = null;
                          for (int p = 8080; p <= 8090; p++) {
                              try {
                                  LinkServer s = new LinkServer(p);
                                  s.start(NanoHTTPD.SOCKET_READ_TIMEOUT, false);
                                  server = s;
                                  port = p;
                                  break;
                              } catch (Exception e) {
                                  last = e;
                              }
                          }
                          if (server == null) {
                              call.reject("Server gagal dinyalakan: " + (last != null ? last.getMessage() : ""));
                              return;
                          }
                      }
                      String ip = findIp();
                      JSObject r = new JSObject();
                      if (ip != null) {
                          r.put("url", "http://" + ip + ":" + port);
                      }
                      call.resolve(r);
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  }
              }

              @PluginMethod
              public void stop(PluginCall call) {
                  if (server != null) {
                      server.stop();
                      server = null;
                  }
                  call.resolve();
              }

              @PluginMethod
              public void update(PluginCall call) {
                  main = call.getString("main", "");
                  footer = call.getString("footer", "");
                  ver++;
                  call.resolve();
              }

              @PluginMethod
              public void setState(PluginCall call) {
                  pubState = call.getString("state", "{}");
                  call.resolve();
              }

              @PluginMethod
              public void takeInbox(PluginCall call) {
                  JSObject r = new JSObject();
                  synchronized (inbox) {
                      r.put("json", inbox.toString());
                      while (inbox.length() > 0) {
                          inbox.remove(0);
                      }
                  }
                  call.resolve(r);
              }

              @Override
              protected void handleOnDestroy() {
                  if (server != null) {
                      server.stop();
                      server = null;
                  }
                  super.handleOnDestroy();
              }

              private class LinkServer extends NanoHTTPD {
                  LinkServer(int p) {
                      super(p);
                  }


                  private Response handleAdd(IHTTPSession session) {
                      try {
                          Map<String, String> files = new HashMap<>();
                          session.parseBody(files);
                          String body = files.get("postData");
                          JSONObject d = new JSONObject(body == null ? "{}" : body);
                          String teamId = d.optString("teamId", "");
                          String text = d.optString("questionText", "").trim();
                          String ans = d.optString("correctAnswer", "").trim();
                          if (text.length() > 1000) text = text.substring(0, 1000);
                          if (ans.length() > 500) ans = ans.substring(0, 500);

                          boolean teamOk = false;
                          JSONArray ts = new JSONObject(pubState).optJSONArray("teams");
                          if (ts != null) {
                              for (int i = 0; i < ts.length(); i++) {
                                  if (teamId.equals(ts.getJSONObject(i).optString("id"))) teamOk = true;
                              }
                          }

                          int count = 0;
                          JSONArray qs = new JSONObject(pubState).optJSONArray("questions");
                          if (qs != null) {
                              for (int i = 0; i < qs.length(); i++) {
                                  if (teamId.equals(qs.getJSONObject(i).optString("teamId"))) count++;
                              }
                          }
                          synchronized (inbox) {
                              for (int i = 0; i < inbox.length(); i++) {
                                  if (teamId.equals(inbox.getJSONObject(i).optString("teamId"))) count++;
                              }
                          }

                          JSONObject res = new JSONObject();
                          if (!teamOk) {
                              res.put("ok", false);
                              res.put("error", "Kelompok tidak ditemukan");
                          } else if (count >= 5) {
                              res.put("ok", false);
                              res.put("error", "Batas 5 soal per kelompok sudah tercapai");
                          } else if (text.isEmpty() || ans.isEmpty()) {
                              res.put("ok", false);
                              res.put("error", "Soal dan kunci jawaban wajib diisi");
                          } else {
                              JSONObject item = new JSONObject();
                              item.put("id", "q-" + System.currentTimeMillis() + "-" + (int) (Math.random() * 1000));
                              item.put("teamId", teamId);
                              item.put("questionText", text);
                              item.put("correctAnswer", ans);
                              synchronized (inbox) {
                                  inbox.put(item);
                              }
                              res.put("ok", true);
                          }
                          Response r = newFixedLengthResponse(Response.Status.OK, "application/json; charset=utf-8", res.toString());
                          r.addHeader("Cache-Control", "no-store");
                          return r;
                      } catch (Exception e) {
                          return newFixedLengthResponse(Response.Status.INTERNAL_ERROR, "application/json; charset=utf-8", "{\"ok\":false,\"error\":\"Gagal memproses soal\"}");
                      }
                  }

                  @Override
                  public Response serve(IHTTPSession session) {
                      String uri = session.getUri();
                      try {
                          if (uri.equals("/state")) {
                              JSONObject o = new JSONObject();
                              o.put("ver", ver);
                              o.put("main", main);
                              o.put("footer", footer);
                              Response r = newFixedLengthResponse(Response.Status.OK, "application/json; charset=utf-8", o.toString());
                              r.addHeader("Cache-Control", "no-store");
                              return r;
                          }
                          if (uri.equals("/web3/state")) {
                              Response r = newFixedLengthResponse(Response.Status.OK, "application/json; charset=utf-8", pubState);
                              r.addHeader("Cache-Control", "no-store");
                              return r;
                          }
                          if (uri.equals("/web3/add") && session.getMethod() == Method.POST) {
                              return handleAdd(session);
                          }
                          String asset = null;
                          String mime = null;
                          if (uri.equals("/") || uri.equals("/index.html")) {
                              asset = "public/projector-web.html";
                              mime = "text/html; charset=utf-8";
                          } else if (uri.equals("/web3") || uri.equals("/web3/")) {
                              asset = "public/web3-local.html";
                              mime = "text/html; charset=utf-8";
                          } else if (uri.equals("/tailwind.js")) {
                              asset = "public/tailwind.js";
                              mime = "application/javascript; charset=utf-8";
                          }
                          if (asset != null) {
                              InputStream is = getContext().getAssets().open(asset);
                              return newChunkedResponse(Response.Status.OK, mime, is);
                          }
                      } catch (Exception e) {
                          return newFixedLengthResponse(Response.Status.NOT_FOUND, "text/plain", "Tidak ditemukan");
                      }
                      return newFixedLengthResponse(Response.Status.NOT_FOUND, "text/plain", "404");
                  }
              }
          }
