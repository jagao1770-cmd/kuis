          (function () {
            var ctx = null;
            function ac() {
              if (!ctx) {
                var C = window.AudioContext || window.webkitAudioContext;
                if (!C) return null;
                ctx = new C();
              }
              if (ctx.state === 'suspended') ctx.resume();
              return ctx;
            }
            document.addEventListener('pointerdown', function () { ac(); }, true);

            function tone(freq, start, dur, type, vol) {
              var c = ac();
              if (!c) return;
              var t0 = c.currentTime + start;
              var o = c.createOscillator();
              var g = c.createGain();
              o.type = type || 'sine';
              o.frequency.setValueAtTime(freq, t0);
              g.gain.setValueAtTime(0.0001, t0);
              g.gain.exponentialRampToValueAtTime(vol || 0.35, t0 + 0.02);
              g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
              o.connect(g);
              g.connect(c.destination);
              o.start(t0);
              o.stop(t0 + dur + 0.05);
            }

            var SOUNDS = {
              correct: function () {
                tone(523.25, 0.00, 0.18, 'triangle', 0.4);
                tone(659.25, 0.14, 0.18, 'triangle', 0.4);
                tone(783.99, 0.28, 0.18, 'triangle', 0.4);
                tone(1046.5, 0.42, 0.70, 'triangle', 0.45);
                tone(1318.5, 0.42, 0.70, 'sine', 0.2);
              },
              wrong: function () {
                tone(180, 0.00, 0.40, 'sawtooth', 0.35);
                tone(130, 0.38, 0.65, 'sawtooth', 0.4);
              },
              timeout: function () {
                for (var i = 0; i < 4; i++) {
                  tone(880, i * 0.40, 0.18, 'square', 0.25);
                  tone(660, i * 0.40 + 0.20, 0.18, 'square', 0.25);
                }
                tone(200, 1.7, 0.8, 'sawtooth', 0.35);
              }
            };

            window.playResultSound = function (kind) {
              try { if (SOUNDS[kind]) SOUNDS[kind](); } catch (e) {}
            };

            var prevRender = window.renderApp;
            var lastState = null;
            window.renderApp = function () {
              prevRender();
              var st = gameState;
              if (lastState !== null && lastState !== st && st === 'RESULT') {
                var k = window.resultKind ? window.resultKind() : null;
                if (k) window.playResultSound(k);
              }
              lastState = st;
            };
          })();
